app: proyecto-final
org: seonion


service: api-productos

provider:
  name: aws
  runtime: nodejs18.x  
  stage: ${opt:stage}
  timeout: 30
  iam:
    role: arn:aws:iam::659277875740:role/LabRole

custom:
  tableName: t_productos-${self:provider.stage}

functions:
  create:
    name: CreateProduct-${self:provider.stage}
    handler: Lambda_CrearProductos.lambda_handler
    events:
      - http:
          path: /product/create
          method: post
          cors:
            origin: http://proyecto-final-plaza-vea.s3-website-us-east-1.amazonaws.com
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
          integration: lambda-proxy  
          request:
            parameters:
              headers:
                Authorization: true

  findBySku:
    name: FindProduct-${self:provider.stage}
    handler: Lambda_FindProduct.lambda_handler
    events:
      - http:
          path: /product/find
          method: post
          cors:
            origin: http://proyecto-final-plaza-vea.s3-website-us-east-1.amazonaws.com
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
          integration: lambda-proxy 
          request:
            parameters:
              headers:
                Authorization: true

  listProducts:
    name: listProducts-${self:provider.stage}
    handler: Lambda_ListarProductos.lambda_handler
    events:
      - http:
          path: /product/list
          method: post
          cors:
            origin: http://proyecto-final-plaza-vea.s3-website-us-east-1.amazonaws.com
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
          integration: lambda-proxy 
          request:
            parameters:
              headers:
                Authorization: true

  PatchProduct:
    name: patchProducts-${self:provider.stage}
    handler: Lambda_ModificarProducto.lambda_handler
    events:
      - http:
          path: /product/patch
          method: patch
          cors:
            origin: http://proyecto-final-plaza-vea.s3-website-us-east-1.amazonaws.com
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
          integration: lambda-proxy 
          request:
            parameters:
              headers:
                Authorization: true

  DeleteProduct:
    name: deleteProducts-${self:provider.stage}
    handler: Lambda_EliminarProducto.lambda_handler
    events:
      - http:
          path: /product/delete
          method: delete
          cors:
            origin: http://proyecto-final-plaza-vea.s3-website-us-east-1.amazonaws.com
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
          integration: lambda-proxy 
          request:
            parameters:
              headers:
                Authorization: true

resources:
  Resources:
    ProductosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tableName}
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: sort_id
            AttributeType: S
          - AttributeName: sku
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: sort_id
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
        GlobalSecondaryIndexes:
          - IndexName: SkuIndex
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: sku
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
